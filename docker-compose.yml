services:
  postgres:
    image: postgres:17-alpine
    container_name: siam-postgres
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payloadcms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payloadcms']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: localdev.dockerfile
    container_name: siam-app
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://payload:payload@postgres:5432/payloadcms
      - PAYLOAD_SECRET=your-secret-key-change-this
      - NODE_ENV=development
      - RBAC_SOURCE=db
      - LOCAL_STORAGE_PATH=/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
