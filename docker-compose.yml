services:
  postgres:
    image: postgres:17-alpine
    container_name: siam-postgres
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payloadcms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payloadcms']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: localdev.dockerfile
    container_name: siam-app
    ports:
      - '3000:3000'
    env_file:
      # Opcional: management-system/.env.local no es necesario para levantar el stack local —
      # todo lo que Postgres/Payload necesitan ya está hardcodeado abajo en `environment:`.
      # Solo hace falta ese archivo para secretos reales (Auth0, etc.), no para desarrollo local.
      - path: .env.local
        required: false
    environment:
      - DATABASE_URL=postgresql://payload:payload@postgres:5432/payloadcms
      - PAYLOAD_SECRET=your-secret-key-change-this
      - NODE_ENV=development
      - RBAC_SOURCE=db
      - LOCAL_STORAGE_PATH=/tmp/uploads
      # Dev only — token fijo para el agente demo 'agent-001' (scripts/seed-agent.ts), así
      # scanner-prototype/run_agent.sh puede apuntar acá sin copiar nada de los logs. Nunca un
      # secreto real: cambiar/quitar esta línea no rompe nada, seed-agent.ts cae de vuelta a un
      # token random (mostrado una vez en el log) si no está seteada.
      - DEMO_AGENT_API_KEY=siam-dev-demo-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads_data:/app/uploads
    # Sin migraciones: el deploy de este proyecto recrea la imagen/DB desde cero cada vez, no
    # las necesita. Payload sincroniza el schema solo con NODE_ENV=development (pushDevSchema).
    # DEV ONLY — no copiar a un compose de producción sin sacar `pnpm seed:navigation`/`seed:agent`:
    # `seed:navigation` crea los 4 Roles base + la única organización demo (Org/Office/Settings/
    # Subscription) + un admin/org_admin/org_viewer/office_manager de demo con credenciales fijas;
    # `seed:agent` corre después y reutiliza esa misma Office (no crea una segunda organización) —
    # nada de esto es algo que quieras cerca de un cliente real.
    command: sh -c "pnpm seed:navigation && pnpm seed:agent && pnpm run dev"

volumes:
  postgres_data:
  uploads_data:
