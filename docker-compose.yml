services:
  postgres:
    image: postgres:17-alpine
    container_name: siam-postgres
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: payloadcms
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payloadcms']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: localdev.dockerfile
    container_name: siam-app
    ports:
      - '3001:3001'
    env_file:
      # Opcional: management-system/.env.local no es necesario para levantar el stack local —
      # todo lo que Postgres/Payload necesitan ya está hardcodeado abajo en `environment:`.
      # Solo hace falta ese archivo para secretos reales (Auth0, etc.), no para desarrollo local.
      - path: .env.local
        required: false
    environment:
      - DATABASE_URL=postgresql://payload:payload@postgres:5432/payloadcms
      - PAYLOAD_SECRET=your-secret-key-change-this
      - NODE_ENV=development
      - RBAC_SOURCE=db
      - LOCAL_STORAGE_PATH=/tmp/uploads
      # `next dev` lee PORT y escucha ahí directo — sin esto escuchaba en 3000 adentro del
      # contenedor mientras el host solo tenía mapeado 3001, y el log de Next ("Local:
      # http://localhost:3000") no coincidía con la URL real a la que había que entrar.
      - PORT=3001
      # buildAgentPackage.ts arma el .zip del agente leyendo esta carpeta (default '../scanner-prototype'
      # relativo a cwd), que sin este mount no existe adentro del container.
      - SCANNER_SOURCE_ROOT=/scanner-prototype
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - uploads_data:/app/uploads
      - ../scanner-prototype:/scanner-prototype:ro
    # Sin migraciones: el deploy de este proyecto recrea la imagen/DB desde cero cada vez, no
    # las necesita. Payload sincroniza el schema solo con NODE_ENV=development (pushDevSchema).
    # DEV ONLY — no copiar a un compose de producción sin sacar `pnpm seed:navigation`:
    # `seed:navigation` crea los 4 Roles base + la única organización demo (Org/Office/Settings/
    # Subscription) + un admin/org_admin/org_viewer/office_manager de demo con credenciales fijas;
    # El agente solo se vincula desde Administration > Offices > Install scanner.
    command: sh -c "pnpm seed:navigation && pnpm run dev"

volumes:
  postgres_data:
  uploads_data:
