name: PR Check

on:
  pull_request:
    # ready_for_review: al sacar un PR de borrador corre todo. Los borradores no corren
    # ningún job (ver el `if` de cada uno): se itera en draft sin gastar minutos de Actions.
    types: [opened, synchronize, reopened, ready_for_review]

# Un push nuevo al mismo PR cancela la corrida anterior: ahorra minutos de Actions.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Hoy tarda ~2 min. `pnpm test` ya no usa --test-force-exit: un test que deje algo abierto
    # colgaría el job; con este límite falla en vez de consumir minutos hasta el tope de Actions.
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Todo el repo. Los errores previos están en eslint-suppressions.json: solo falla por
      # errores nuevos (los arreglados sin podar no fallan; se podan con pnpm lint:prune).
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run test
      # Componentes React (Vitest + happy-dom, *.component.test.tsx). Sin base de datos.
      - run: pnpm run test:components
      - run: pnpm run build
        env:
          # payload.config.ts exige un origen HTTPS canónico en producción (lib/platform-origin.ts).
          # Este build no se despliega: alcanza con un origen reservado (.invalid, RFC 6761).
          NEXT_PUBLIC_SITE_URL: https://ci.invalid

  # Tests de integración (*.integration.test.ts, node:test) contra un PostgreSQL real y vacío.
  # Cada suite siembra sus propios datos; Payload crea el schema al arrancar porque
  # NODE_ENV=test no es producción (pushDevSchema). La base nace y muere con el job.
  integration:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        # Misma imagen que docker-compose.yml.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: siam_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d siam_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Payload no inicia sin llaveros del AuditLog: claves nuevas en cada corrida, enmascaradas.
      - run: bash scripts/ci-audit-keys.sh
      - run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://payload:payload@localhost:5432/siam_ci
          # Solo firma sesiones de una base descartable: no es un secreto.
          PAYLOAD_SECRET: ci-only-not-a-secret

  # Suites *.audit.integration.test.ts (Vitest): permisos, alcance por tenant y contratos.
  # Cada suite exige en su guarda su propia base vacía (usuario, puerto y prefijo fijos), así
  # que el script crea una por suite. Un solo Postgres atiende los tres puertos de las guardas.
  audit-integration:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Las URLs de las guardas no llevan contraseña; la base nace y muere con el job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55443:5432
          - 55447:5432
          - 55448:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Igual que en `integration`: estas suites también inician Payload.
      - run: bash scripts/ci-audit-keys.sh
      - run: pnpm run test:audit:integration:all
        env:
          PAYLOAD_SECRET: ci-only-not-a-secret
      # Paso aparte para ver su tiempo y sus fallos por separado: corre la seed sobre una base
      # vacía y tiene pruebas de concurrencia. Si resulta inestable en Actions, se saca de acá.
      - run: pnpm run test:audit:integration:all remaining-corroboration
        env:
          PAYLOAD_SECRET: ci-only-not-a-secret
