name: PR Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install
      - run: pnpm run type-check
      - run: pnpm run test
      - run: pnpm run build
        env:
          # payload.config.ts exige un origen HTTPS canónico en producción (lib/platform-origin.ts).
          # Este build no se despliega: alcanza con un origen reservado (.invalid, RFC 6761).
          NEXT_PUBLIC_SITE_URL: https://ci.invalid
